/* ---- Doppioni: oltre all’identificativo, stessa data, conto, importo ed esercente (descrizione ripulita) ---- */
const _prepDup = preparaImport;
preparaImport = function(ris, nome){
  const im = _prepDup(ris, nome), chiave = (c, x) => [c, x.data, Math.round(x.importo*100), normTesto(x.descrizione)].join('|'), salvati = {}, visti = {};
  for (const x of lista('estratto')) { const k = chiave(x.conto, x); salvati[k] = (salvati[k]||0) + 1; }
  for (const r of im.righe) { const k = chiave(im.conto, r); visti[k] = (visti[k]||0) + 1; if (!r.dup && visti[k] <= (salvati[k]||0)) r.dup = true; }
  return im;
};

/* ================= FASE 3g: DOPPIONI TRA IMPORTAZIONI E COPERTURA ================= */
/* Descrizione normalizzata per l’impronta: la banca può togliere “-da contab” quando contabilizza */
function normRaw(s){ return String(s||'').toLowerCase().replace(/-?\s*da\s*contab\w*/g, '').replace(/\s+/g, ' ').trim(); }
const simileDesc = (a, b) => { const x = normTesto(a).split(' ').slice(0,2).join(' '), y = normTesto(b).split(' ').slice(0,2).join(' '); return !!x && !!y && (x === y || x.includes(y) || y.includes(x)); };
const _prepara3g = preparaImport;
preparaImport = function(ris, nome){
  const im = _prepara3g(ris, nome), alias = new Set(); for (const x of lista('estratto')) if (x.alias) for (const a of [].concat(x.alias)) alias.add(a);
  for (const r of im.righe) r.dup = !!S.a.estratto[r.id] || (r.idVecchio && !!S.a.estratto[r.idVecchio]) || alias.has(r.id);
  /* Righe già salvate nel periodo del file che il file non contiene più: probabilmente cambiate (descrizione o data contabile) */
  const ids = new Set(); for (const r of im.righe) { ids.add(r.id); if (r.idVecchio) ids.add(r.idVecchio); }
  const mancanti = lista('estratto').filter(x => x.conto === im.conto && !x.parte_di && x.data >= im.da && x.data <= im.a && !ids.has(x.id) && ![].concat(x.alias||[]).some(a => ids.has(a)));
  im.probabili = [];
  for (const r of im.righe) { if (r.dup) continue; const k = mancanti.findIndex(x => Math.abs(x.importo - r.importo) < 0.005 && Math.abs(giorniTra(parse(x.data), parse(r.data))) <= 5 && simileDesc(x.descrizione, r.descrizione));
    if (k >= 0) { r.dup = true; r.probabile = mancanti[k].id; im.probabili.push(r); mancanti.splice(k, 1); } }
  return im;
};
/* Al salvataggio la riga già presente prende data e descrizione nuove e ricorda l’impronta nuova */
const _salva3g = AZ.estr_salva;

/* ---- Copertura come unione di periodi; il giorno dell’esportazione non conta come completo ---- */
copertura = function(){
  const per = {};
  for (const x of lista('importazioni')) { if (!x.da || !x.a) continue; let a = x.a; if (x.data && x.data <= x.a) a = iso(piuGiorni(parse(x.a), -1)); if (a < x.da) continue; (per[x.conto] = per[x.conto] || []).push([x.da, a]); }
  const out = {};
  for (const [c, l] of Object.entries(per)) { l.sort((p,q) => p[0] < q[0] ? -1 : 1); const m = [];
    for (const [d, a] of l) { const u = m[m.length-1]; if (u && d <= iso(piuGiorni(parse(u[1]), 1))) { if (a > u[1]) u[1] = a; } else m.push([d, a]); }
    out[c] = { da:m[0][0], a:m[m.length-1][1], intervalli:m }; }
  return out;
};
const coperto = (x, d0, d1) => !!x && x.intervalli.some(([d, a]) => d <= d0 && a >= d1);
coperturaMese = function(m){
  const cop = copertura(), i0 = iso(m.inizio), i1 = iso(m.fine), manca = [];
  for (const c of CONTI_ESTRATTO()) { if (c.aperto_il && c.aperto_il > i1) continue; const x = cop[c.id], da0 = c.aperto_il && c.aperto_il > i0 ? c.aperto_il : i0;
    if (!x) manca.push(c.nome+': mai importato'); else if (!coperto(x, da0, i1)) manca.push(c.nome+': manca una parte tra il '+dataMedia(da0)+' e il '+dataMedia(i1)+(x.a < i1 ? ' (importato fino al '+dataMedia(x.a)+')' : '')); }
  return { completo: !manca.length, manca };
};
copreCarta = function(dataIso){ const x = copertura().prepagata; return coperto(x, dataIso, dataIso); };

/* ================= FASE 4: SOGLIA E JOLLY (PIANO PENSIONE §7.4, POLICY §9) ================= */
TUTTE.push('soglia');
const P0 = k => S.a.parametri[k] ? P(k) : null;
/* Coefficiente FOI: 1 fino al 2027; dal 2028 quello registrato nel PIANO PENSIONE §7.4, altrimenti stima con l’inflazione del piano */
function coeffFoi(anno){
  const dal = P0('pensione.soglia.rivalutazione_dal') || 2028; if (anno < dal) return { valore:1, tipo:'nessuna' };
  const p = S.a.parametri['pensione.soglia.foi.'+anno]; if (p && p.valore != null) return { valore:Number(p.valore), tipo:'registrato' };
  const inf = (P0('pensione.inflazione') != null ? P0('pensione.inflazione') : 2.5)/100; return { valore: Math.pow(1+inf, anno - 2026.5), tipo:'stima' };
}
/* La soglia del piano è in euro 2026; quella che si confronta con il portafoglio è rivalutata */
soglia = (function(orig){ window.sogliaReale = orig; return function(d){ const v = orig(d); return v == null ? null : Math.round(v * coeffFoi(d.getFullYear()).valore); }; })(soglia);
const sogliaReale = window.sogliaReale;
function minimoVersamento(d){ const m = P('investimenti.versamento.minimo'); if (m == null) return null; return r2(m * coeffFoi((d||oggi()).getFullYear()).valore); }

/* Previsione al prossimo 1° gennaio di verifica, in euro correnti (Stima) */
function previsioneSoglia(){
  const t = oggi(), pv = P('policy.soglia.prima_verifica') || 2028, anno = Math.max(pv, t.getFullYear()+1), T = new Date(anno, 0, 1);
  const pf = portafoglio().totale, pi = pianoIngresso(), flussi = [];
  if (pi) for (const r of pi.rate) if (!r.fatta && r.data < T) flussi.push({ d: r.data < t ? t : r.data, v: pi.rata || 0, k:'rate' });
  const cr = credito730(), a730 = Number(PS('investimenti.credito_730.anno_destinato')); if (cr && a730) { const d = new Date(a730, (P('budget.mensilita.premio.mese')||8)-1, 10); if (d < T) flussi.push({ d: d < t ? t : d, v:cr, k:'730' }); }
  const vers = dateVersamento(t, piuGiorni(T, -1));
  /* Mensilità aggiuntive: prima le buste annuali dell’anno solare, poi metà del resto al portafoglio (BUDGET §10.4) */
  const ann = ordinati('buste').filter(b => b.tipo === 'annuale'), bisogno = {}, qp = (P('budget.mensilita.quota_portafoglio') || 50)/100;
  for (let i = 0; i < 26; i++) { const d0 = new Date(t.getFullYear(), t.getMonth()+i, 1); if (d0 >= T) break;
    for (const ms of mensilitaDelMese(d0.getMonth()+1)) { const d = accredito(d0.getFullYear(), d0.getMonth()); if (d < t || d >= T || !ms.importo) continue;
      if (lista('destinazioni').some(x => x.tipo === 'mensilita' && x.sottotipo === ms.tipo && String(x.data).slice(0,7) === iso(d).slice(0,7))) continue;
      const y = d.getFullYear(); if (bisogno[y] == null) bisogno[y] = Math.max(0, ann.reduce((s,b) => s + (P(b.param)||0) - (y === t.getFullYear() ? alimentatoAnno(b.id, y) : 0), 0));
      const usa = Math.min(ms.importo, bisogno[y]); bisogno[y] -= usa; const q = r2((ms.importo - usa) * qp); if (q > 0) flussi.push({ d, v:q, k:'mens' }); } }
  const somma = k => r2(flussi.filter(x => x.k === k).reduce((s,x) => s + x.v, 0));
  const inf = (P0('pensione.inflazione') != null ? P0('pensione.inflazione') : 2.5)/100, rp = (P0('pensione.rendimento.prudente') != null ? P0('pensione.rendimento.prudente') : 2.25)/100, co = (P0('pensione.costi.portafoglio') != null ? P0('pensione.costi.portafoglio') : 0.23)/100;
  const rm = Math.pow((1 + rp - co) * (1 + inf), 1/12) - 1;
  const simula = (versa, rend) => { let v = pf; const ev = flussi.concat(vers.map(d => ({ d, v:versa }))).sort((a,b) => a.d - b.d); let cur = new Date(t);
    for (const e of ev) { if (rend) v *= Math.pow(1+rm, giorniTra(cur, e.d)/30.44); v += e.v; cur = e.d; } if (rend) v *= Math.pow(1+rm, giorniTra(cur, T)/30.44); return r2(v); };
  const min = P('investimenti.versamento.minimo') || 0, obi = P('investimenti.versamento.obiettivo') || 0;
  const base = r2(pf + somma('rate') + somma('730') + vers.length*min), conMens = r2(base + somma('mens'));
  return { anno, T, pf, rate:somma('rate'), r730:somma('730'), nv:vers.length, min, obi, vers:r2(vers.length*min), mens:somma('mens'), base, conMens, conRend:simula(min, true), conRendObi:simula(obi, true),
    sogliaReale: sogliaReale(T), coeff:coeffFoi(anno), soglia: soglia(T), inf:inf*100, rp:rp*100 };
}

const _prepara3h = preparaImport;
preparaImport = function(ris, nome){
  const im = _prepara3h(ris, nome);
  const man = confermati('movimenti').filter(x => x.tipo === 'spesa' && x.cat && CAT[x.cat]);
  for (const r of im.righe) {
    if (r.dup) continue;
    r.stato = r.scelta && confermataDaMotivo(r) ? 'confermata' : 'proposta';
    if (r.importo < 0) { const q = im.conto === 'prepagata' ? (r.quota || 1) : (quotaConto(S.a.conti[im.conto]||{}) || 1);
      const m = man.find(x => (x.importo_totale != null ? Math.abs(x.importo_totale + r.importo) < 0.01 : Math.abs(x.importo - r2(-r.importo*q)) < 0.01) && Math.abs(giorniTra(parse(x.data), parse(r.data_op || r.data))) <= 7);
      if (m) { r.cat = m.cat; r.scelta = vocePerCat(m.cat); r.stato = 'confermata'; r.motivo = 'come la spesa segnata a mano “'+(m.descrizione||'')+'”'; r.daMano = true; } }
  }
  /* Stesso esercente (non generico): le altre righe senza conferma prendono la stessa categoria come proposta */
  for (const r of im.righe.filter(x => x.daMano && !generico(x.gruppo))) for (const o of im.righe) if (!o.dup && o !== r && o.gruppo === r.gruppo && o.stato !== 'confermata') { o.cat = r.cat; o.scelta = r.scelta; o.motivo = 'come la spesa segnata a mano dello stesso esercente'; o.stato = 'proposta'; }
  for (const r of im.righe) if (generico(r.gruppo) && im.ricorda[r.gruppo] == null) im.ricorda[r.gruppo] = false;

/* Bersagli: g:gruppo e r:indice (import in corso), s:id e sg:conto|gruppo (righe salvate), sc:categoria (proposte salvate di una categoria) */
function righeDi(k){
  const [t, v] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':')+1)], im = ui.estr;
  if (t === 'g') return { imp:true, l: im.righe.filter(r => !r.dup && r.gruppo === v && (!r.scelta || r.stato === 'dubbio' || r.gruppoDa === v)) };
  if (t === 'r') return { imp:true, l: [im.righe[Number(v)]].filter(Boolean) };
  if (t === 'p') return { imp:true, l: im.righe.filter(r => !r.dup && r.scelta && r.stato === 'proposta' && (r.cat || r.scelta) === v) };
  if (t === 's') return { imp:false, l: [S.a.estratto[v]].filter(Boolean) };
  if (t === 'sg') { const [c, g] = v.split('|'); return { imp:false, l: lista('estratto').filter(x => x.conto === c && gruppoDi(x.descrizione) === g && statoRiga(x) !== 'confermata') }; }
  if (t === 'sc') return { imp:false, l: lista('estratto').filter(x => x.scelta && statoRiga(x) === 'proposta' && (catAuto(x) || x.scelta) === v) };
  return { imp:true, l:[] };
}
async function applica(k, patch){

  if (!l.length) return; await scrivi(async () => { for (const x of l) await aggiorna('estratto', x.id, patch); });
  if (patch.cat && k.startsWith('sg:')) { const g = k.split('|')[1]; if (!generico(g) && !lista('regole').some(x => x.tipo === 'classe' && x.testo === g)) await scrivi(() => aggiungi('regole', { tipo:'classe', testo:g, scelta:patch.scelta, cat:patch.cat, origine:'app' })); }

  const x = S.a.estratto[id]; if (!x || !CAT[catB]) return false; const segno = x.importo < 0 ? -1 : 1, b = r2(Math.abs(impB)) * segno;
  if (Math.abs(b) < 0.01 || Math.abs(b) >= Math.abs(x.importo) - 0.009) return false;
  const copia = Object.assign({}, x); delete copia.id; delete copia.alias;
  return scrivi(async () => {
    await aggiorna('estratto', id, { importo: r2(x.importo - b), importo_originale: x.importo_originale != null ? x.importo_originale : x.importo });
    await metti('estratto', id+'-p'+Date.now().toString(36), Object.assign(copia, { importo:b, cat:catB, scelta:vocePerCat(catB), stato:'confermata', motivo:'parte divisa da una riga dell’estratto', parte_di:id, descrizione:(x.descrizione||'')+' (parte)' }));

}

/* Spese fuori budget dagli estratti del mese (pesano sul mese, non su “Uscite quotidiane”), al netto di quelle già segnate a mano */
function fuoriEstrattiMese(m){
  let imp = 0, man = 0;
  for (const x of lista('estratto')) if (nelMese(x.data, m) && contaRiga(x) && x.scelta && x.scelta.startsWith('x:') && x.scelta !== 'x:fondo_pensione') imp += -x.importo * (x.quota != null ? x.quota : 1);

  return r2(imp - man);
}
