<style>

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--testo);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}

.app{max-width:1120px;margin:0 auto}

.verde{color:var(--verde-fg)}
.cresce{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.t-verde{background:var(--verde-bg);color:var(--verde-fg)}.t-blu{background:var(--blu-bg);color:var(--blu-fg)}.t-ambra{background:var(--ambra-bg);color:var(--ambra-fg)}
.t-corallo{background:var(--corallo-bg);color:var(--corallo-fg)}.t-rosa{background:var(--rosa-bg);color:var(--rosa-fg)}.t-viola{background:var(--viola-bg);color:var(--viola-fg)}
.t-petrolio{background:var(--petrolio-bg);color:var(--petrolio-fg)}.t-grigio{background:var(--grigio-bg);color:var(--grigio-fg)}
.t-pieno,.t-ambra-p{background:var(--amb);color:var(--amb-ink)}.t-primario{background:var(--pri);color:var(--pri-ink)}
.c-verde{background:var(--verde)}.c-blu{background:var(--blu)}.c-ambra{background:var(--ambra)}.c-corallo{background:var(--corallo)}.c-rosa{background:var(--rosa)}
.c-viola{background:var(--viola)}.c-petrolio{background:var(--petrolio)}.c-primario{background:var(--pri)}.c-grigio{background:var(--grigio)}

.eroe,.scura{background:var(--pri);color:var(--pri-ink)}
.eroe{border-radius:24px;padding:20px}

.eroe-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.eroe-num span,.eroe-nota,.eroe-testo,.chiaro{font-size:14px;color:var(--pri-soft)}
.eroe-nota{font-size:13px}
.barra{height:8px;background:var(--track);border-radius:999px;display:flex;overflow:hidden}

.dest{display:flex;align-items:center;gap:10px;font-size:14px}

.tbar{height:34px;display:flex;gap:3px;font-size:13px;font-weight:600}
.tbar>div{border-radius:10px;display:flex;align-items:center;padding-left:10px;overflow:hidden;white-space:nowrap}
.tbar .az{background:var(--pri);color:#fff}.tbar .ob{background:var(--obbl);color:#14302A;padding-left:8px}.tbar .mf{flex:1;background:var(--amb);color:#14302A;justify-content:center;padding:0}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tbar .ob{color:#fff}:root:not([data-theme="light"]) .tbar:not(.chiaro) .az{background:#2FA08F;color:#06221D}}
:root[data-theme="dark"] .tbar .ob{color:#fff}:root[data-theme="dark"] .tbar:not(.chiaro) .az{background:#2FA08F;color:#06221D}
.scad{display:flex;align-items:center;gap:12px;font-size:14px;text-align:left}

.quando b{font-size:16px;font-weight:600}
.pn{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;text-decoration:none;color:var(--muted);font-size:13px;min-height:44px}
.pn strong{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--ink)}
.busta{display:flex;align-items:center;gap:12px}
.busta .cresce{display:flex;flex-direction:column;gap:6px}
.busta-testa{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.busta-testa span{font-weight:500}.busta-testa strong{font-weight:600;white-space:nowrap}
.ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.riga{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;width:100%;text-align:left}
.riga>span:first-child{font-weight:500}
.riga .imp{font-weight:600;text-align:right;white-space:nowrap}
.riga.rosso{color:var(--corallo-fg)}
.voce,.etf{display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none;color:inherit;width:100%}
.voce strong,.etf strong{font-size:15px;font-weight:600;white-space:nowrap}
main[data-vista="dati"] .voce strong{white-space:normal;max-width:45%;text-align:right;overflow-wrap:anywhere;font-size:14px}
.voce .cresce,.etf .cresce{min-width:0;overflow-wrap:anywhere}
.peso{width:48px;height:34px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nudo{background:none;border:0;padding:0;cursor:pointer;min-height:44px}
.bottoni{display:flex;gap:10px}
.bottoni.colonna{flex-direction:column}
.btn{flex:1;min-height:46px;border:1.5px solid var(--border);border-radius:14px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 14px;text-decoration:none}
.btn.primario{border-color:var(--amb);background:var(--amb);color:var(--amb-ink)}
.btn.su-scuro{background:transparent;color:#fff;border-color:var(--pri-soft)}
.btn.scelto{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.btn:disabled,.quadro:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;min-height:44px;color:var(--link);font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start}
.link.rosso{color:var(--corallo-fg);align-self:center;white-space:nowrap}
.card>.link{margin:-8px 0}
.pillola{min-height:44px;padding:0 14px;border:1.5px solid var(--border);border-radius:999px;background:var(--card);font-size:13px;font-weight:500;cursor:pointer}
.nota-ambra{background:var(--ambra-bg);color:var(--ink)}
.nota-ambra .sotto{color:var(--ink);font-size:13px}
.attesa{border:1.5px dashed var(--ambra)}

.bolla.app{align-self:flex-start;background:var(--card);color:var(--muted);border-radius:16px 16px 16px 4px}
.scrivi{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:18px;padding:6px 6px 6px 14px}
.scrivi.fondo{background:var(--card);position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 18px rgba(0,0,0,.08)}
.scrivi input{flex:1;min-width:0;min-height:44px;border:0;outline:0;background:transparent;font-size:16px}
.quadro{width:44px;height:44px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.filebtn{cursor:pointer;position:relative}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.form input,.form select,input[type=search]{min-height:46px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);padding:0 12px;font-size:16px;width:100%}
input.mini{width:108px;min-height:40px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);padding:0 10px;text-align:right;font-size:16px;font-weight:600}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.passo{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}
.passo b{width:32px;height:32px;border-radius:999px;background:var(--pri);color:#fff;font-family:var(--disp);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.velo{position:fixed;inset:0;background:rgba(8,20,17,.5);z-index:40}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:88%;overflow-y:auto;max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:90%;text-align:center}
.export{width:100%;height:160px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);font-family:ui-monospace,monospace;font-size:11px;padding:8px}
.blocco-link{cursor:pointer}
.passi{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.incolla{width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);padding:10px;font-size:16px;font-family:ui-monospace,monospace}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eroe-num strong.medio{font-size:28px;letter-spacing:-.5px;line-height:1.15}
.storico{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
a.link{display:inline-flex;align-items:center;text-decoration:none}
.scad .link,.voce .link{align-self:center;white-space:nowrap}
.gh-badge{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 4px);right:12px;border:0;font:600 11px/1 var(--testo);padding:5px 9px;border-radius:999px;cursor:pointer}
main{padding-top:36px}
#gh-setup{position:fixed;inset:0;z-index:70;background:rgba(8,20,17,.5)}
#gh-setup[hidden]{display:none}
.gh-foglio{z-index:71}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:220px 1fr;gap:8px}
  nav{position:sticky;top:0;align-self:start;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:28px 12px;background:transparent}
  nav a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:14px}
  main{max-width:none;margin:0;padding:28px 28px 60px;display:block;columns:2;column-gap:16px}
  main>*{break-inside:avoid;margin-bottom:16px}
  main>.indietro{margin-bottom:4px}
  main[data-vista="dati"],main[data-vista="assistente"],main[data-vista="chiusura"],main[data-vista="mensilita"],main[data-vista="simula"],main[data-vista="note"],main[data-vista="decisioni"],main[data-vista="rotta"]{columns:1;max-width:640px}
  main>.testa,main>.indietro,main>.fonte,main>.pn,main>.chips,main>.bottoni,main>.centro{column-span:all}
  main>.bolla{width:fit-content;margin-left:auto}
  main>.bottoni{max-width:520px}
  .scrivi.fondo{bottom:20px}
  .foglio{bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);border-radius:24px;width:520px}

}

.azioni{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px} .azione{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--ambra-bg)} .azione.critica{background:var(--corallo-bg)} .azione .nome{font-weight:600} .azione .sotto{color:var(--ink);margin-top:2px} .btn.piccolo{flex:0 0 auto;min-height:44px;font-size:14px;padding:6px 12px} @media (max-width:360px){.azione{flex-direction:column;align-items:stretch}}
.tre{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .tre div{display:flex;flex-direction:column;gap:2px} .tre span{font-size:12px;color:var(--muted)} .tre b{font-size:16px;font-weight:600} .voce-sp{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)} .voce-sp:last-of-type{border-bottom:0;padding-bottom:0} .mesi-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600} .mesi-nav .btn{min-width:48px}
.estr-gr,.estr-riga{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)} .estr-gr .cresce,.estr-riga .cresce{flex:1 1 220px;min-width:0} .estr-gr select,.estr-riga select,.card label>select{flex:1 1 170px;min-height:42px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;padding:4px 8px;max-width:100%} .card>label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)} .spunta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-height:42px} .estr-voce{border-bottom:1px solid var(--line)} .estr-voce>.voce{min-height:46px;cursor:pointer} .tab-estr{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:baseline} .tab-estr>span:nth-child(-n+3){font-size:12px;color:var(--muted)} .tab-estr b{font-weight:600;text-align:right} .tab-estr>span:nth-child(3n){text-align:right;color:var(--muted)} details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.tab-estr.tab4{grid-template-columns:1fr auto auto auto} .tab-estr.tab4>*{text-align:right} .tab-estr.tab4>span:nth-child(4n+1){text-align:left} .tab-estr.tab4>span:nth-child(-n+4){font-size:12px;color:var(--muted)}
</style>
</head>

<div class="app">
<nav id="nav" aria-label="Sezioni"></nav>

</div>
<div id="strato"><div id="foglio"></div><div id="toast"></div></div>
<script>
"use strict";
/* Versione GitHub: sostituisce i servizi di claude.ai con
   - dati: un file JSON in un repository GitHub privato (API Contents), con token salvato solo sul dispositivo
   - assistente: nessuna chiave API; le letture passano da Claude sul telefono con copia e incolla
   - download: file scaricato dal browser
   L'app usa la stessa interfaccia window.claude.use(), quindi il resto del codice non cambia. */
(function(){
const CFG_KEY = 'finanze.config';
const cfg = (() => { try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) { return {}; } })();
const salvaCfg = c => { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} };
if ('chiave' in cfg || 'modello' in cfg) { delete cfg.chiave; delete cfg.modello; salvaCfg(cfg); } // la chiave API non si usa più: la tolgo dal dispositivo
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- GitHub ---------- */
const gh = {
  url(){ return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/'); },
  head(raw){ return { 'Authorization':'Bearer '+cfg.token, 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; },
  async leggi(){
    const r = await fetch(gh.url()+'?t='+Date.now(), { headers:gh.head(false), cache:'no-store' });
    if (r.status === 404) return { manca:true };
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw { code: r.status === 401 || r.status === 403 ? 'auth' : 'rete', status:r.status, msg:m }; }
    const j = await r.json(); let testo;
    if (j.content && j.encoding === 'base64') testo = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')), c => c.charCodeAt(0)));
    else { const r2 = await fetch(gh.url()+'?t='+Date.now(), { headers:gh.head(true), cache:'no-store' }); if (!r2.ok) throw { code:'rete', status:r2.status }; testo = await r2.text(); }
    return { sha:j.sha, dati:JSON.parse(testo) };
  },
  async scrivi(dati, sha){
    const b = new TextEncoder().encode(JSON.stringify(dati, null, 1)); let bin = ''; for (let i = 0; i < b.length; i += 32768) bin += String.fromCharCode.apply(null, b.subarray(i, i+32768));
    const body = { message:'Aggiornamento dati '+new Date().toISOString().slice(0,16).replace('T',' '), content:btoa(bin) }; if (sha) body.sha = sha;
    const r = await fetch(gh.url(), { method:'PUT', headers:Object.assign({ 'Content-Type':'application/json' }, gh.head(false)), body:JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) throw { code:'conflitto' };
    if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? 'auth' : 'rete', status:r.status };
    return (await r.json()).content.sha;
  }
};

/* ---------- Archivio locale sincronizzato ---------- */
const st = { dati:{ archivi:{} }, sha:null, coda:[], subs:{}, stato:'carico', msg:'', timer:null, inVolo:false };
const copia = o => JSON.parse(JSON.stringify(o));
const nomeCol = p => { const s = String(p).split('/'); if (s.length % 2 === 0) throw new TypeError('Percorso di collezione non valido'); return s[s.length-1]; };
const arch = n => (st.dati.archivi[n] = st.dati.archivi[n] || {});
function snap(n){ const a = arch(n); const docs = Object.keys(a).sort().map(id => ({ id, exists:true, data:() => copia(a[id]), metadata:{ fromCache:false, hasPendingWrites: st.coda.length > 0 } })); return { docs, size:docs.length, empty:!docs.length, metadata:{ fromCache:false, hasPendingWrites: st.coda.length > 0 }, docChanges:() => [] }; }
function notifica(n){ const l = n ? [n] : Object.keys(st.subs); for (const k of l) for (const f of (st.subs[k]||[])) { try { f(snap(k)); } catch (e) { console.error(e); } } }
function applica(op, base){ const a = base.archivi[op.n] = base.archivi[op.n] || {};
  if (op.t === 'set') a[op.id] = copia(op.d); else if (op.t === 'update') a[op.id] = Object.assign({}, a[op.id] || {}, copia(op.d)); else if (op.t === 'delete') delete a[op.id]; }
function scrittura(op){ if (st.stato === 'errore_auth') return Promise.reject({ code:'unauthenticated' }); applica(op, st.dati); st.coda.push(op); setTimeout(() => notifica(op.n), 0); programmaSalva(); return Promise.resolve(); }
function programmaSalva(){ clearTimeout(st.timer); st.timer = setTimeout(salva, 1200); badge('salvo'); }
async function salva(){
  if (st.inVolo || !st.coda.length) return; st.inVolo = true; const inviati = st.coda.length;
  try {
    for (let tent = 0; tent < 4; tent++) {
      try { st.sha = await gh.scrivi(st.dati, st.sha); st.coda.splice(0, inviati); badge(st.coda.length ? 'salvo' : 'ok'); break; }
      catch (e) { if (e.code !== 'conflitto') throw e;
        const r = await gh.leggi(); const base = r.manca ? { archivi:{} } : r.dati; base.archivi = base.archivi || {};
        for (const op of st.coda) applica(op, base); st.dati = base; st.sha = r.manca ? null : r.sha; notifica(); if (tent === 3) throw { code:'conflitto' }; }
    }
  } catch (e) { console.error(e); st.stato = e.code === 'auth' ? 'errore_auth' : 'errore'; badge(e.code === 'auth' ? 'auth' : 'errore'); }
  st.inVolo = false; if (st.coda.length && st.stato !== 'errore_auth') { if (st.stato === 'errore') { st.timer = setTimeout(() => { st.stato = 'ok'; salva(); }, 8000); } else programmaSalva(); }
}
async function ricarica(){ if (st.coda.length || st.inVolo || st.stato === 'carico') return; try { const r = await gh.leggi(); if (!r.manca && r.sha !== st.sha) { st.dati = r.dati; st.dati.archivi = st.dati.archivi || {}; st.sha = r.sha; notifica(); } badge('ok'); } catch (e) { badge(e.code === 'auth' ? 'auth' : 'offline'); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ricarica(); });
window.addEventListener('focus', ricarica);
window.addEventListener('beforeunload', e => { if (st.coda.length) { e.preventDefault(); e.returnValue = ''; } });

const db = {
  collection(p){ const n = nomeCol(p); return {
    path:p,
    doc(id){ return { id, path:p+'/'+id, set:d => scrittura({ t:'set', n, id, d }), update:d => (arch(n)[id] ? scrittura({ t:'update', n, id, d }) : Promise.reject({ code:'invalid_argument', message:'Documento inesistente' })), delete:() => scrittura({ t:'delete', n, id }), get: async () => ({ id, exists: !!arch(n)[id], data:() => arch(n)[id] ? copia(arch(n)[id]) : undefined }) }; },
    onSnapshot(f, ferr){ (st.subs[n] = st.subs[n] || []).push(f); if (st.stato !== 'carico') setTimeout(() => f(snap(n)), 0); return () => { st.subs[n] = (st.subs[n]||[]).filter(x => x !== f); }; },
    async get(){ return snap(n); }
  }; }
};

const downloads = { async save(r){ const blob = new Blob([r.data], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = r.filename || 'dati.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return { status:'saved' }; } };

/* ---------- Indicatore di sincronizzazione e impostazioni ---------- */
const TESTI = { carico:['Carico…','grigio'], ok:['Salvato','verde'], salvo:['Salvo…','ambra'], errore:['Non salvato: riprovo','corallo'], offline:['Senza connessione','corallo'], auth:['Token non valido','corallo'] };
function badge(s){ const grave = x => x === 'errore' || x === 'auth'; const prima = window.__sync; window.__sync = s; if (grave(prima) !== grave(s) && typeof window.render === 'function') setTimeout(window.render, 0);
  elementi(); const el = document.getElementById('gh-badge'); if (!el) return; const t = TESTI[s] || TESTI.ok; el.textContent = t[0]; el.className = 'gh-badge t-'+t[1]; }
function pannello(msg, mancaFile){
  elementi(); const p = document.getElementById('gh-setup'); p.hidden = false;
  p.innerHTML = '<div class="foglio gh-foglio" role="dialog" aria-modal="true" aria-label="Impostazioni"><h2>Impostazioni</h2>'+(msg ? '<p class="sotto warn">'+esc(msg)+'</p>' : '')+
  '<div class="form"><p class="titolino">Dati su GitHub</p><label>Utente GitHub<input id="gs_owner" autocomplete="off" value="'+esc(cfg.owner||'')+'"></label><label>Repository privato dei dati<input id="gs_repo" autocomplete="off" value="'+esc(cfg.repo||'')+'"></label><label>File dei dati<input id="gs_path" autocomplete="off" value="'+esc(cfg.path||'dati.json')+'"></label><label>Token (fine-grained, solo questo repository, Contents: Read and write)<input id="gs_token" type="password" autocomplete="off" value="'+esc(cfg.token||'')+'"></label>'+
  (mancaFile ? '<label>Il file non esiste ancora: scegli il file esportato dall’app per crearlo<input id="gs_file" type="file" accept=".json,application/json"></label>' : '')+
  '<p class="sotto">Il token resta solo in questo browser.</p></div>'+
  '<div class="bottoni"><button class="btn primario" id="gs_ok">Salva e collega</button>'+(st.stato !== 'carico' ? '<button class="btn" id="gs_no">Chiudi</button>' : '')+'</div>'+(cfg.token ? '<button class="link rosso" id="gs_esci">Scollega questo dispositivo</button>' : '')+'</div>';
  document.getElementById('gs_ok').onclick = async () => {
    const v = id => (document.getElementById(id)||{}).value || '';
    Object.assign(cfg, { owner:v('gs_owner').trim(), repo:v('gs_repo').trim(), path:(v('gs_path').trim() || 'dati.json'), token:v('gs_token').trim() });
    if (!cfg.owner || !cfg.repo || !cfg.token) return pannello('Servono utente, repository e token.', mancaFile);
    const f = document.getElementById('gs_file'); 
    if (f && f.files && f.files[0]) { try { const j = JSON.parse(await f.files[0].text()); if (!j || !j.archivi || !j.archivi.parametri) throw 0; await gh.scrivi({ app:'Finanze personali', creato:new Date().toISOString(), archivi:j.archivi }, null); } catch (e) { return pannello(e && e.code === 'auth' ? 'Il token non può scrivere in questo repository.' : 'Il file scelto non è un’esportazione valida dell’app.', true); } }
    salvaCfg(cfg); location.reload();
  };
  const no = document.getElementById('gs_no'); if (no) no.onclick = () => { p.hidden = true; };
  const ex = document.getElementById('gs_esci'); if (ex) ex.onclick = () => { if (st.coda.length && !confirm('Ci sono modifiche non ancora salvate. Scollegare comunque?')) return; localStorage.removeItem(CFG_KEY); location.reload(); };
}

async function avviaDati(){
  if (!cfg.owner || !cfg.repo || !cfg.token) { pannello(''); return new Promise(() => {}); }
  cfg.path = cfg.path || 'dati.json';
  try { const r = await gh.leggi(); if (r.manca) { pannello('Il file '+cfg.path+' non esiste nel repository.', true); return new Promise(() => {}); }
    st.dati = r.dati; st.dati.archivi = st.dati.archivi || {}; st.sha = r.sha; st.stato = 'ok'; badge('ok'); notifica(); return true; }
  catch (e) { pannello(e.status === 401 ? 'GitHub non riconosce il token (errore 401): è scritto male, incompleto o revocato. Ricopialo per intero, inizia con github_pat_.' : e.status === 403 ? 'Il token è valido ma non può leggere questo repository (errore 403): nel token servono Repository access con finanze-dati e il permesso Contents: Read and write.'+(e.msg ? ' Messaggio di GitHub: '+e.msg : '') : 'GitHub non risponde. Controlla la connessione e riprova.'); return new Promise(() => {}); }
}
let pronto = null;
window.claude = { use(n){
  if (n === 'db') return (pronto = pronto || avviaDati()).then(() => db);
  if (n === 'user') return Promise.resolve({ id: async () => 'io' });
  if (n === 'sample') return Promise.resolve(null);
  if (n === 'downloads') return Promise.resolve(downloads);
  return Promise.resolve(null);
} };
function elementi(){
  if (!document.body) return;
  if (!document.getElementById('gh-badge')) { const b = document.createElement('button'); b.id = 'gh-badge'; b.className = 'gh-badge t-grigio'; b.textContent = 'Carico…'; b.setAttribute('aria-label', 'Stato del salvataggio e impostazioni'); b.onclick = () => pannello(''); document.body.appendChild(b); }
  if (!document.getElementById('gh-setup')) { const p = document.createElement('div'); p.id = 'gh-setup'; p.hidden = true; document.body.appendChild(p); }
}
document.addEventListener('DOMContentLoaded', elementi);
})();

</script>
<script>
"use strict";
/* ===== Stato e archivi ===== */
const ARCHIVI = ['parametri','conti','saldi','destinazioni','buste','spese_fisse','movimenti','mesi','posizioni','operazioni','fondo_pensione'];
const S = { a:{}, caricati:{}, uid:null, db:null, sample:null, limiti:null, dett:null, down:null, pronto:false, errore:null, lento:false, mancanti:new Set() };
ARCHIVI.forEach(n => S.a[n] = {});

/* ===== Date ===== */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const p = String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const oggi = () => { if (window.__OGGI) return parse(window.__OGGI); const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const piuGiorni = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const giorniTra = (a,b) => Math.round((b-a)/864e5);
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const dataBreve = d => { d = typeof d==='string' ? parse(d) : d; return d.getDate()+' '+MESI[d.getMonth()]; };
const dataMedia = d => { d = typeof d==='string' ? parse(d) : d; return d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear(); };
const dataLunga = d => GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI_L[d.getMonth()];
const isData = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parse(s));

/* ===== Parametri: unica fonte dei valori delle regole ===== */
function par(k){ const p = S.a.parametri[k]; if (!p) { S.mancanti.add(k); return null; } return p; }
function P(k){ const p = par(k); if (!p) return null; const v = Number(p.valore); return isFinite(v) ? v : null; }
function PS(k){ const p = par(k); return p ? String(p.valore) : null; }
function fonte(k){ const p = S.a.parametri[k]; if (!p) return ''; return p.documento + (p.sezione ? ' §'+p.sezione : ''); }
function fonteDoc(o){ return o && o.documento ? o.documento + (o.sezione ? ' §'+o.sezione : '') : ''; }
const lista = (arch) => Object.entries(S.a[arch]).map(([id,v]) => Object.assign({id}, v));
const ordinati = (arch) => lista(arch).sort((a,b) => (a.ordine||0)-(b.ordine||0));
const confermati = (arch) => lista(arch).filter(x => x.stato !== 'non_confermato');
const inAttesa = (arch) => lista(arch).filter(x => x.stato === 'non_confermato');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v*100)/100;

/* ===== Mese di budget (BUDGET §10.1) ===== */
function meseDi(d){
  const g = P('budget.mese.giorno_inizio') || 10;
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() < g) m--;
  const inizio = new Date(y, m, g);
  const fine = new Date(inizio.getFullYear(), inizio.getMonth()+1, g-1);
  return { id: inizio.getFullYear()+'-'+pad(inizio.getMonth()+1), inizio, fine, prossimo: piuGiorni(fine,1) };
}
function meseDaId(id){ const p = id.split('-').map(Number); return meseDi(new Date(p[0], p[1]-1, P('budget.mese.giorno_inizio') || 10)); }
function mesePrec(m){ return meseDi(piuGiorni(m.inizio, -1)); }
const etichettaMese = m => dataBreve(m.inizio)+' – '+dataBreve(m.fine);
function accredito(y, m){ const g = P('budget.stipendio.giorno_accredito') || 10; let d = new Date(y, m, g); while (d.getDay()===0 || d.getDay()===6 || festivo(d)) d = piuGiorni(d,1); return d; }
function prossimoStipendio(){ const t = oggi(); for (let i = 0; i < 3; i++) { const d = accredito(t.getFullYear(), t.getMonth()+i); if (d > t) return d; } return meseDi(t).prossimo; }
const giorniAlloStipendio = () => giorniTra(oggi(), prossimoStipendio());
const nelMese = (dataIso, m) => dataIso >= iso(m.inizio) && dataIso <= iso(m.fine);

function stipendioAtteso(dataIso){
  let best = null;
  for (const [k,p] of Object.entries(S.a.parametri)) {
    if (!k.startsWith('budget.stipendio.netto.') || !p.valido_dal || p.valido_dal > dataIso) continue;
    if (!best || p.valido_dal > best.valido_dal) best = Object.assign({k}, p);
  }
  return best ? { importo: Number(best.valore), chiave: best.k } : null;
}
const TIPI_MENSILITA = {
  tredicesima: 'Tredicesima', quattordicesima: 'Quattordicesima', premio: 'Premio di risultato',
  una_tantum: 'Una tantum', premio_extra: 'Premio extra', rimborso_730: 'Rimborso 730'
};
function mensilitaDelMese(meseNum){
  const out = [];
  for (const t of ['tredicesima','quattordicesima','premio'])
    if (P('budget.mensilita.'+t+'.mese') === meseNum) out.push({ tipo:t, nome:TIPI_MENSILITA[t], importo:P('budget.mensilita.'+t+'.importo') });
  return out;
}

/* ===== Buste (BUDGET §10.2) ===== */
function saldoBusta(id){
  let s = 0;
  for (const m of confermati('movimenti')) {
    if (m.busta !== id) continue;
    if (m.tipo === 'alimentazione' || m.tipo === 'rettifica') s += m.importo;
    else if (m.tipo === 'spesa' || m.tipo === 'non_registrate') s -= m.importo;
  }
  return r2(s);
}
function alimentatoAnno(id, anno){
  let s = 0;
  for (const m of confermati('movimenti')) if (m.busta === id && m.tipo === 'alimentazione' && String(m.data).slice(0,4) === String(anno)) s += m.importo;
  return r2(s);
}
const importoBusta = b => P(b.param);
function statoBuste(){
  return ordinati('buste').map(b => { const imp = importoBusta(b), saldo = saldoBusta(b.id); return Object.assign({}, b, { importo: imp, saldo, perc: imp ? clamp(saldo/imp*100, 0, 100) : 0 }); });
}
const bustaQuotidiana = () => ordinati('buste').find(b => b.assorbe_non_registrate) || null;
const saldoTotaleBuste = () => r2(statoBuste().reduce((s,b) => s + Math.max(0,b.saldo), 0));

/* ===== Conti e saldi (BUDGET §10.1, PATRIMONIO §1) ===== */
function ultimoSaldo(conto, entro){
  let best = null;
  for (const s of confermati('saldi')) {
    if (s.oggetto === 'posizione' || s.conto !== conto) continue;
    if (entro && s.data > entro) continue;
    if (!best || s.data > best.data || (s.data === best.data && (s.creato||'') > (best.creato||''))) best = s;
  }
  return best;
}
function quotaConto(c){ const q = P(c.param_quota); return q == null ? null : q/100; }
function liquidita(entro, soloCorrenti){
  const righe = []; let tot = 0; const mancanti = [];
  for (const c of ordinati('conti')) {
    if (c.classe !== 'liquidita') continue;
    if (soloCorrenti && c.tipo !== 'corrente') continue;
    const s = ultimoSaldo(c.id, entro), q = quotaConto(c);
    if (!s || q == null) { mancanti.push(c); righe.push({ c, s:null, valore:null, q }); continue; }
    const v = r2(s.importo*q); tot += v; righe.push({ c, s, valore:v, q });
  }
  return { totale: r2(tot), righe, mancanti, completo: mancanti.length === 0 && righe.length > 0 };
}
function eVecchio(dataIso, chiave){ const g = P(chiave); if (!dataIso || g == null) return false; return giorniTra(parse(dataIso), oggi()) > g; }
function giacenze(){
  const out = [];
  for (const c of ordinati('conti')) {
    if (!c.param_minimo) continue;
    const s = ultimoSaldo(c.id), min = P(c.param_minimo), pieno = c.param_pieno ? P(c.param_pieno) : null;
    let stato = 'manca';
    if (s && min != null) stato = s.importo < min ? 'sotto' : (pieno != null && s.importo >= pieno ? 'pieno' : 'ok');
    out.push({ c, s, min, pieno, stato });
  }
  return out;
}

/* ===== Liquidità per destinazione (INVESTIMENTI §1–2) ===== */
function rateEseguite(){
  const set = new Set(); let tot = 0;
  for (const o of confermati('operazioni')) if (o.tipo === 'rata_ingresso') { set.add(o.rata); tot += o.importo; }
  return { numeri:set, totale:r2(tot) };
}
function destinazioni(){
  const L = liquidita();
  let resto = L.totale; const righe = []; let scoperto = false;
  const D = S.a.destinazioni;
  const prendi = (id, voluto, extra) => {
    const v = r2(clamp(voluto, 0, Math.max(0, resto))); if (v < voluto - 0.005) scoperto = true; resto = r2(resto - v);
    righe.push(Object.assign({ id, nome: id === 'buste' ? 'Budget per voce' : ((D[id]||{}).nome || id), colore:(D[id]||{}).colore, valore:v, obiettivo:voluto, pieno: v >= voluto - 0.005, fonte: fonteDoc(D[id]) }, extra||{}));
  };
  const fe = P('investimenti.fondo_emergenza.importo'), rc = P('investimenti.riserva_casa.importo'), go = P('budget.giacenza_operativa');
  const usato = (D.fondo_emergenza||{}).utilizzato || 0;
  if (fe != null) prendi('fondo_emergenza', Math.max(0, fe - usato), { usato, target:fe });
  if (rc != null) prendi('riserva_casa', rc, { target:rc });
  if (go != null) prendi('giacenza_operativa', go, { target:go });
  const sb = saldoTotaleBuste();
  if (sb > 0) prendi('buste', sb, {});
  const di = D.da_investire || {};
  const fissato = di.importo_fissato != null;

/* ===== Portafoglio (POLICY §8, INVESTIMENTI §2–3) ===== */

  const fEtf = P('policy.fasce.etf'), fMax = P('policy.fasce.etf_max_punti'), fBl = P('policy.fasce.blocchi'), fEcc = P('policy.fasce.eccezione');

/* ===== Destinazione delle mensilità aggiuntive (BUDGET §10.4) ===== */

const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtNum(v, dec){ const neg = v < 0; v = Math.abs(v); const s = v.toFixed(dec); const p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−' : '') + p[0] + (dec ? ','+p[1] : ''); }
const eur = v => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '− € ' : '€ ') + fmtNum(Math.abs(v), Math.abs(v - Math.round(v)) > 0.004 ? 2 : 0);
const eur0 = v => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '− € ' : '€ ') + fmtNum(Math.abs(Math.round(v)), 0);
const perc = v => v == null ? '—' : fmtNum(v, 1) + '%';
function num(s){ if (typeof s === 'number') return s; s = String(s == null ? '' : s).replace(/[€\s]/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); return parseFloat(s); }
const gg = n => n === 1 ? '1 giorno' : n+' giorni';
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const adesso = () => new Date().toISOString();

const ICONE = {
  casa_nav:'<path d="M4 11l8-7 8 7v9H4z"/>', busta_nav:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/>',
  banca:'<path d="M3 10l9-5 9 5"/><path d="M5 10v8M12 10v8M19 10v8M3 19h18"/>', torta:'<path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>', tazza:'<path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/><path d="M8 3v2M12 3v2"/>',
  croce:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>', sole:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  casa:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>', auto:'<path d="M4 16v-4l2-5h12l2 5v4z"/><path d="M4 12h16"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/>',
  regalo:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M3 7h18v3H3zM12 7v13"/><path d="M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0"/>',
  ciclo:'<path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M4 20v-5h5"/>',
  foto:'<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>', mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  invia:'<path d="M5 12h14M13 6l6 6-6 6"/>', dati:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>'
};
const ico = (n, s) => '<svg aria-hidden="true" width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONE[n]||'')+'</svg>';
const chip = (t, tono) => '<span class="chip t-'+(tono||'verde')+'">'+h(t)+'</span>';
const riga = (a, b, cls) => '<div class="riga '+(cls||'')+'"><span>'+a+'</span><span class="imp">'+b+'</span></div>';
const fonteRiga = t => '<p class="fonte">'+t+'</p>';

/* ===== Stato dell’interfaccia ===== */
const ui = { vista:'oggi', sheet:null, chat:[], occupato:false, campi:{}, chius:{}, mens:{ tipo:'tredicesima', modifica:false, mod:null }, filtro:'', elimina:null, toast:null, mic:{ attivo:false, campo:null, parziale:'' }, ultimaSpesa:null };
const VISTE_NAV = [['oggi','Oggi','casa_nav'],['budget','Budget','busta_nav'],['conti','Conti','banca'],['portafoglio','Portafoglio','torta'],['assistente','Assistente','chat']];
const TUTTE = ['oggi','budget','conti','portafoglio','assistente','chiusura','mensilita','dati'];

/* ===== Database ===== */
const col = n => S.db.collection('data/users/'+S.uid+'/app/'+n);
async function scrivi(fn){ try { await fn(); return true; } catch (e) { console.error(e); avviso(e && e.code === 'quota_exceeded' ? 'Archivio pieno: esporta i dati e alleggerisci i movimenti.' : 'Salvataggio non riuscito. Riprova.'); return false; } }
async function metti(arch, id, dati){ S.a[arch][id] = dati; await col(arch).doc(id).set(dati); }
async function aggiorna(arch, id, patch){ S.a[arch][id] = Object.assign({}, S.a[arch][id], patch); await col(arch).doc(id).update(patch); }
async function aggiungi(arch, dati){ const id = nid(); await metti(arch, id, Object.assign({ creato:adesso() }, dati)); return id; }
async function togli(arch, id){ delete S.a[arch][id]; await col(arch).doc(id).delete(); }
function avviso(t){ ui.toast = t; render(); clearTimeout(avviso.t); avviso.t = setTimeout(() => { ui.toast = null; render(); }, 4200); }

/* ===== Intestazione comune ===== */
function testa(sopra, titolo, indietro, senzaAvvisi){
  const att = senzaAvvisi ? 0 : numInAttesa();
  return (indietro ? '<a class="indietro" href="#'+indietro[0]+'">‹ '+h(indietro[1])+'</a>' : '') +
  '<header class="testa"><div><p class="sopra">'+sopra+'</p><h1>'+titolo+'</h1></div><div class="testa-az">'+
  (att ? '<a class="chip t-ambra chip-link" href="#assistente">'+att+' da confermare</a>' : '')+
  '<a class="tondo" href="#dati" aria-label="Dati e regole">'+ico('dati',20)+'</a></div></header>';
}
const numInAttesa = () => inAttesa('movimenti').length + inAttesa('saldi').length + inAttesa('fondo_pensione').length;
function barra(p, colore, fondo, k){ return '<div class="barra'+(fondo ? ' su-primario' : '')+'"><div class="c-'+colore+'"'+(k ? ' data-k="'+k+'"' : '')+' style="width:'+clamp(p,0,100).toFixed(1)+'%"></div></div>'; }
function barraTarget(bl, chiaro){
  if (!bl) return '';
  return '<div class="tbar'+(chiaro ? ' chiaro' : '')+'"><div class="az" style="width:'+bl.azioni+'%">Azioni '+bl.azioni+'</div><div class="ob" style="width:'+bl.obbligazioni+'%">Obbl. '+bl.obbligazioni+'</div><div class="mf">'+bl.managed_futures+'</div></div>';
}

/* ===== Schede dei dati in attesa di conferma ===== */
function cardAttesa(arch, x){
  let corpo = '', titolo = 'Ho letto questi dati. Li salvo?';
  if (arch === 'movimenti') {
    if (x.tipo === 'spesa') {
      const b = x.busta ? S.a.buste[x.busta] : null;
      if (b) { const imp = P(b.param), s = saldoBusta(x.busta); titolo = 'Scalo '+eur(x.importo)+' da “'+h(b.nome)+'”?'; corpo = '<p class="sotto">Su questa voce restano '+eur(s - x.importo)+' di '+eur(imp)+'.</p>'; }
      else { titolo = 'Registro '+eur(x.importo)+' come spesa non a budget?'; corpo = '<p class="sotto">Non rientra in nessuna voce di budget: pesa sul mese (BUDGET §10.2).</p>'; }
      corpo += '<p class="sotto">'+h(x.descrizione||'Spesa')+' · '+dataMedia(x.data)+(x.nota_lettura ? ' · '+h(x.nota_lettura) : '')+'</p>';
    } else { titolo = 'Registro un’entrata di '+eur(x.importo)+'?'; corpo = '<p class="sotto">'+h(x.descrizione||'Entrata')+' · '+dataMedia(x.data)+'</p>'; }
  } else if (arch === 'saldi') {
    if (x.oggetto === 'posizione') { const e = S.a.posizioni[x.etf] || {}; corpo = riga(h(e.ticker||x.etf), h(e.nome||'')) + (x.quote != null ? riga('Quote', fmtNum(x.quote, 4)) : '') + (x.prezzo != null ? riga('Prezzo', eur(x.prezzo)) : '') + (x.valore != null ? riga('Valore', eur(x.valore)) : '') + riga('Data', dataMedia(x.data)); }
    else { const c = S.a.conti[x.conto] || {}; corpo = riga(h(c.nome||x.conto), eur(x.importo)) + riga('Data del saldo', dataMedia(x.data)) + riga('Fonte', h(x.fonte||'')); }
  } else if (arch === 'fondo_pensione') {
    corpo = x.tipo === 'contributi' ? riga('Contributi deducibili '+h(x.anno), eur(x.progressivo)) + riga('Data', dataMedia(x.data)) : riga('Posizione nel fondo pensione', eur(x.posizione)) + riga('Data', dataMedia(x.data));
  }
  return '<section class="card attesa"><p class="titolino">'+titolo+' '+chip('non confermato','ambra')+'</p>'+corpo+
    '<div class="bottoni"><button class="btn primario" data-act="conferma" data-arch="'+arch+'" data-id="'+h(x.id)+'">Conferma</button><button class="btn" data-act="correggi" data-arch="'+arch+'" data-id="'+h(x.id)+'">'+(arch === 'movimenti' ? 'Modifica' : 'Correggi')+'</button></div>'+
    '<button class="link" data-act="scarta" data-arch="'+arch+'" data-id="'+h(x.id)+'">Scarta</button></section>';
}
const attese = arch => inAttesa(arch).sort((a,b) => (a.creato||'') < (b.creato||'') ? -1 : 1).map(x => cardAttesa(arch, x)).join('');

/* ===== Vista: Oggi ===== */
function vOggi(){
  const m = meseDi(oggi()), g = giorniAlloStipendio(), aperto = S.a.mesi[m.id];
  let o = testa('Mese di budget '+etichettaMese(m), 'Ciao Michele', null, true);
  o += cardDaFare();
  const bq = bustaQuotidiana();
  if (!aperto) {
    o += '<section class="card eroe"><div class="eroe-testa"><span>Mese di budget '+etichettaMese(m)+'</span>'+chip(gg(g)+' allo stipendio','pieno')+'</div><p class="eroe-testo">Il mese non è ancora aperto: le voci mensili non sono ancora ricaricate.</p></section>';
  } else if (bq) {
    const imp = P(bq.param), s = saldoBusta(bq.id), f = fisseMese(m), corr = liquidita(null, true), go = P('budget.giacenza_operativa');
    let cop = '';
    if (f.daPagare > 0) cop = !corr.completo ? ' · saldi dei conti mancanti' : (go != null && corr.totale - f.daPagare >= go ? ' · già coperte' : ' · non coperte con la giacenza minima');
    o += '<section class="card eroe"><div class="eroe-testa"><span>'+h(bq.nome)+'</span>'+chip(gg(g)+' allo stipendio','pieno')+'</div>'+
      '<div class="eroe-num"><strong>'+eur0(s)+'</strong><span>restano di '+eur(imp)+'</span></div>'+barra(imp ? s/imp*100 : 0, 'ambra', true, 'eroe')+
      '<p class="eroe-nota">Uscite fisse con data ancora da pagare: '+eur0(f.daPagare)+cop+'</p></section>';
  }
  const d = destinazioni();
  o += '<section class="card"><div class="card-testa"><h2>I tuoi soldi, per destinazione</h2><strong class="gr">'+(d.totale || d.completo ? eur0(d.totale) : '—')+'</strong></div>';
  if (!d.righe.some(r => r.valore > 0)) o += '<p class="sotto">Mancano i saldi dei conti. Inseriscili in <a href="#conti">Conti</a> o con una foto.</p>';
  else {
    o += '<div class="seg">'+d.righe.filter(r => r.valore > 0).map(r => '<div class="c-'+(r.colore||'grigio')+'" style="flex:'+r.valore+'"></div>').join('')+'</div><div class="elenco">';
    for (const r of d.righe) {
      let st = '';
      if (r.obiettivo != null && r.id !== 'buste' && r.id !== 'da_investire') st = r.pieno ? (r.usato ? chip('usato '+eur0(r.usato),'corallo') : chip(r.id === 'riserva_casa' ? 'piena' : (r.id === 'giacenza_operativa' ? 'ok' : 'pieno'),'verde')) : chip('mancano '+eur0(r.obiettivo - r.valore),'corallo');
      let nome = h(r.nome); if (r.id === 'da_investire') nome = r.fissato ? 'Da investire, rate restanti' : 'Da investire (stima)';
      o += '<div class="dest"><i class="pallino c-'+(r.colore||'grigio')+'"></i><span class="cresce">'+nome+'</span>'+st+'<strong>'+eur0(r.valore)+'</strong></div>';
    }
    o += '</div>';
    if (!d.completo) o += '<p class="sotto warn">Totale parziale: manca il saldo di '+d.mancanti.map(c => h(c.nome)).join(', ')+'.</p>';
    if (d.scoperto) o += '<p class="sotto warn">La liquidità non copre tutte le destinazioni.</p>';
  }
  o += fonteRiga('Regola: INVESTIMENTI §1–2 · “Da investire” si rimisura alla fotografia del 9 che precede l’avvio')+'</section>';

  const t = target(), pi = pianoIngresso();
  if (t) {
    const mostra = (pi && pi.prossima && t.probabile && !valoreTotalePos()) ? t.probabile : t.attivo;
    const eProb = mostra === t.probabile && t.probabile !== t.inVigore;
    o += '<section class="card"><div class="card-testa"><h2>Portafoglio</h2><span class="sotto">'+(pi && pi.prossima ? 'ingresso in '+pi.n+' rate, prossima il '+dataBreve(pi.prossima.data) : (valoreTotalePos() ? eur0(valoreTotalePos()) : ''))+'</span></div>'+barraTarget(mostra)+
      fonteRiga((eProb ? 'Target probabile dal '+dataMedia(t.ricalcolo)+' (in vigore: '+t.inVigore.azioni+' / '+t.inVigore.obbligazioni+' / '+t.inVigore.managed_futures+')' : 'Target in vigore')+' · POLICY §6. Il '+mostra.managed_futures+' sono i managed futures.')+'</section>';
  }
  const sc = scadenze(6);
  o += '<section class="card"><h2>Prossime scadenze</h2><div class="elenco">'+sc.map(x => '<div class="scad"><div class="quando t-'+x.tono+'">'+(x.lontana ? '<b>'+MESI[x.data.getMonth()]+'</b><span>'+x.data.getFullYear()+'</span>' : '<b>'+x.data.getDate()+'</b><span>'+MESI[x.data.getMonth()]+'</span>')+'</div><span class="cresce">'+h(x.nome)+'</span>'+(x.importo != null ? '<strong>'+eur0(x.importo)+'</strong>' : (x.nota ? '<strong class="verde">'+h(x.nota)+'</strong>' : ''))+'</div>').join('')+'</div>'+'<a class="link" href="#scadenze">Tutte le scadenze e le verifiche</a>'+'</section>';
  const pn = patrimonio();
  o += '<a class="pn" href="#conti"><span>Patrimonio netto stimato'+(pn.completo ? '' : ' (parziale)')+'</span><strong>≈ '+eur0(pn.totale)+'</strong></a>';
  return o;
}
const valoreTotalePos = () => r2(lista('posizioni').reduce((s,e) => s+valorePos(e), 0));
function avvisiGenerali(){
  let o = '';
  if (S.pronto && !Object.keys(S.a.parametri).length) o += '<section class="card nota-ambra"><p class="titolino">Archivio parametri vuoto</p><p class="sotto">Senza parametri l’app non applica nessuna regola. Chiedi in chat di ricaricarli dai documenti di progetto.</p></section>';
  else if (S.mancanti.size) o += '<section class="card nota-ambra"><p class="titolino">Parametri mancanti</p><p class="sotto">'+[...S.mancanti].map(h).join(', ')+'</p></section>';
  const mc = meseDaChiudere();
  if (mc) o += '<a class="card nota-ambra blocco-link" href="#chiusura"><p class="titolino">Il mese '+etichettaMese(meseDaId(mc))+' è da chiudere</p><p class="sotto">Fotografa i saldi del 9 e conferma la chiusura.</p></a>';
  const dv = datiVecchi().filter(x => x.stato === 'vecchio');
  if (dv.length) o += '<a class="card nota-ambra blocco-link" href="#conti"><p class="titolino">Dati vecchi</p><p class="sotto">'+dv.map(x => h(x.nome)+' ('+dataBreve(x.data)+')').join(' · ')+'</p></a>';
  const t = target();
  if (t && t.daConfermare) o += '<a class="card nota-ambra blocco-link" href="#portafoglio"><p class="titolino">Ricalcolo del target da confermare</p><p class="sotto">Dal '+dataMedia(t.ricalcolo)+' vale la formula di gennaio: conferma i Fed Funds (POLICY §6).</p></a>';
  return o;
}

/* ===== Vista: Budget ===== */
function rigaBusta(b){
  const unita = b.tipo === 'mensile' ? '' : ' l’anno';
  return '<div class="busta"><div class="ico t-'+b.colore+'">'+ico(b.icona)+'</div><div class="cresce"><div class="busta-testa"><span>'+h(b.nome)+'</span><strong class="'+(b.saldo < 0 ? 'rosso' : '')+'">'+eur0(b.saldo)+'</strong></div>'+barra(b.perc, b.colore, false, 'b_'+b.id)+'<p class="sotto">di '+eur(b.importo)+unita+' · '+h(b.contenuto||'')+'</p></div></div>';
}
function vBudget(){
  const m = meseDi(oggi()), g = giorniAlloStipendio();
  let o = testa(etichettaMese(m)+' · '+gg(g)+' allo stipendio', 'Budget per voce');
  if (!S.a.mesi[m.id]) o += '<section class="card nota-ambra"><p class="titolino">Il mese non è ancora aperto</p><p class="sotto">Aprendolo registri lo stipendio e ricarichi le voci mensili.</p><button class="btn primario" data-act="sheet" data-sheet="apri_mese">Apri il mese</button></section>';
  o += '<section class="card"><h2>Segna una spesa</h2>'+(ui.ultimaSpesa ? '<div class="bolla utente">'+h(ui.ultimaSpesa)+'</div>' : '')+
    '<div class="scrivi"><label class="vh" for="q_spesa">Spesa a parole</label><input id="q_spesa" type="text" data-campo="spesa" data-invio="spesa_parole" placeholder="Es. ho speso 800 € per le vacanze" autocomplete="off">'+
    (S.dett ? '<button class="quadro t-ambra-p" data-act="mic" data-campo="spesa" aria-label="'+(ui.mic.attivo ? 'Ferma la dettatura' : 'Detta')+'">'+ico(ui.mic.attivo && ui.mic.campo === 'spesa' ? 'stop' : 'mic')+'</button>' : '')+
    '<button class="quadro t-primario" data-act="spesa_parole" aria-label="Invia"'+(ui.occupato ? ' disabled' : '')+'>'+ico('invia')+'</button></div>'+
    (ui.occupato === 'spesa' ? '<p class="sotto">Leggo la spesa…</p>' : '')+
    '<button class="link" data-act="sheet" data-sheet="spesa">Inserisci a mano</button></section>';
  o += attese('movimenti');
  o += '<section class="card"><div class="card-testa"><h2>Spese del mese per voce</h2><span class="sotto">'+etichettaMese(m)+'</span></div><p class="sotto">Budget, speso e residuo di ogni voce, con spese fisse e spese fuori budget.</p><div class="bottoni"><button class="btn" data-act="apri_spese">Spese del mese</button><button class="btn" data-go="estratto">Estratti conto</button></div></section>';
  const bs = statoBuste();
  o += '<section class="card"><div><h2>Voci mensili</h2><p class="sotto">Si ricaricano con lo stipendio</p></div>'+bs.filter(b => b.tipo === 'mensile').map(rigaBusta).join('')+'</section>';
  o += '<section class="card"><div><h2>Voci annuali</h2><p class="sotto">Si ricaricano con tredicesima, quattordicesima e premio</p></div>'+bs.filter(b => b.tipo === 'annuale').map(rigaBusta).join('')+notaVociAnnuali(bs)+
    '<button class="btn" data-go="mensilita">Destina una mensilità aggiuntiva</button></section>';
  const f = fisseMese(m);
  o += '<section class="card"><div class="card-testa"><h2>Spese fisse del mese</h2><strong class="gr">'+eur0(f.totale)+'</strong></div><div class="elenco">'+
    f.datate.map(x => '<button class="scad nudo" data-act="sheet" data-sheet="fissa" data-id="'+h(x.sf.id)+'"><div class="quando t-'+(x.pagata ? 'grigio' : 'blu')+'"><b>'+x.data.getDate()+'</b><span>'+MESI[x.data.getMonth()]+'</span></div><span class="cresce">'+h(x.sf.nome)+(x.pagata ? ' <span class="sotto">· passata</span>' : '')+'</span><strong>'+(x.segno < 0 ? '+ ' : '')+eur(x.importo)+'</strong></button>').join('')+
    '</div><p class="titolino spazio">Senza data: media del mese</p><div class="elenco fitto">'+
    f.senzaData.map(x => '<button class="riga nudo" data-act="sheet" data-sheet="fissa" data-id="'+h(x.sf.id)+'"><span>'+h(x.sf.nome)+'</span><span class="imp">'+(x.segno < 0 ? '+ ' : '')+eur(x.importo)+'</span></button>').join('')+
    '</div>'+fonteRiga('Importi dal BUDGET §2–4 e PATRIMONIO §2. Tocca una voce per indicare giorno e importo reali.')+'</section>';
  o += '<section class="card"><h2>Chiusura del mese</h2><p class="sotto">Spesa reale, spese non registrate e saldo delle buste, con la fotografia dei saldi del 9.</p><div class="bottoni"><button class="btn" data-go="chiusura">Apri la chiusura</button><button class="btn" data-go="calibrazione">Calibrazione</button></div></section>';
  o += fonteRiga('Regole: BUDGET §10.2 (budget per voce: “buste” nei documenti), §10.3 (chiusura), §10.4 (mensilità aggiuntive).');
  return o;
}

/* ===== Vista: Conti ===== */
function notaSaldo(s, c, q){
  if (!s) return '<span class="warn">saldo mancante</span>';
  return 'saldo del '+dataBreve(s.data)+' · '+h(s.fonte||'manuale')+(q != null && q !== 1 ? ' · conta al '+Math.round(q*100)+'% di '+eur(s.importo) : '')+(eVecchio(s.data, 'app.vecchio.saldi') ? ' '+chip('dato vecchio','corallo') : '');
}
function vConti(){

/* ===== Vista: Chiusura ===== */
function chiusuraCon(id){
  const c = chiusura(id), x = ui.chius;
  for (const k of ['entrate','investito','fisse']) if (x[k] != null && x[k] !== '' && isFinite(num(x[k]))) c[k] = num(x[k]);
  c.spesaReale = r2(c.L0 + c.entrate - c.investito - c.L1); c.nonRegistrate = r2(c.spesaReale - c.fisse - c.segnalate);
  c.saldoDopo = c.saldoBusta == null ? null : r2(c.saldoBusta - Math.max(0, c.nonRegistrate));
  return c;
}
function vChiusura(){
  const daCh = meseDaChiudere(), id = daCh || meseDi(oggi()).id, c = chiusuraCon(id), m = c.mese, md = S.a.mesi[id];
  let o = testa(etichettaMese(m), 'Chiusura del mese', ['budget','Budget']);
  if (!md) { o += '<section class="card nota-ambra"><p class="titolino">Il mese non è aperto</p><p class="sotto">Apri il mese dal Budget: la chiusura si fa sui mesi aperti.</p></section>'; return o; }
  if (!daCh) o += '<section class="card nota-ambra"><p class="titolino">Anteprima: il mese si chiude il '+dataBreve(m.fine)+'</p><p class="sotto">I numeri sono provvisori finché non c’è la fotografia dei saldi del 9.</p></section>';
  if (c.avvisi.length) o += '<section class="card nota-ambra"><p class="titolino">Saldi da controllare</p>'+c.avvisi.map(a => '<p class="sotto">'+h(a)+'</p>').join('')+'</section>';
  const inp = (k, v) => '<input class="mini" id="c_'+k+'" inputmode="decimal" data-chius="'+k+'" value="'+h(ui.chius[k] != null ? ui.chius[k] : fmtNum(v, Math.abs(v-Math.round(v)) > 0.004 ? 2 : 0))+'" aria-label="'+k+'">';
  o += '<section class="card"><h2>Il conto</h2>'+riga('Liquidità il '+dataBreve(c.d0), c.completi || c.L0 ? eur0(c.L0) : '—')+riga('+ Entrate del mese', inp('entrate', c.entrate))+riga('− Investito o versato al fondo', inp('investito', c.investito))+riga('− Liquidità il '+dataBreve(c.d1), c.scaduta ? eur0(c.L1) : '<span class="sotto">'+eur0(c.L1)+' a oggi</span>')+'<hr>'+riga('<b>Spesa reale</b>', '<b>'+eur0(c.spesaReale)+'</b>')+'</section>';
  o += '<section class="card"><h2>Dove sono andati</h2>'+riga('Uscite fisse', inp('fisse', c.fisse))+riga('Spese che mi hai segnalato', eur0(c.segnalate))+riga('<b>Spese non registrate</b>', '<b>'+eur0(c.nonRegistrate)+'</b>', c.nonRegistrate > 0 ? 'rosso' : '')+'</section>';
  if (c.busta) {
    if (c.nonRegistrate < 0) o += '<section class="card"><p class="titolino">Avanzo di '+eur0(-c.nonRegistrate)+'</p><p class="sotto">La spesa reale è più bassa di uscite fisse e spese segnalate. I documenti non dicono dove va l’avanzo: l’app non lo attribuisce a nessuna voce.</p></section>';
    else if (c.saldoDopo < 0) o += '<section class="card nota-ambra"><p class="titolino">“'+h(c.busta.nome)+'” chiude a '+eur0(c.saldoDopo)+'</p><p class="sotto">Le spese non registrate finiscono in questa voce. Come vuoi recuperare?</p><div class="bottoni colonna"><button class="btn'+(ui.chius.recupero !== 'importo' ? ' scelto' : '')+'" data-act="recupero" data-v="mese">Scalo '+eur0(-c.saldoDopo)+' dal mese prossimo</button><button class="btn'+(ui.chius.recupero === 'importo' ? ' scelto' : '')+'" data-act="recupero" data-v="importo">Correggo il budget della voce</button></div>'+(ui.chius.recupero === 'importo' ? '<p class="sotto">L’importo è una regola del BUDGET §10.2: aggiorna prima il documento, poi il parametro in Dati e regole. La chiusura registra la decisione.</p>' : '')+'</section>';
    else o += '<section class="card"><p class="titolino">“'+h(c.busta.nome)+'” chiude a '+eur0(c.saldoDopo)+'</p><p class="sotto">Quello che avanza passa al mese successivo.</p></section>';
  }
  o += '<div class="bottoni colonna"><button class="btn primario" data-act="chiudi_mese" data-id="'+id+'"'+(c.pronta ? '' : ' disabled')+'>Conferma la chiusura</button></div>'+(c.pronta ? '' : '<p class="sotto centro">'+(c.scaduta ? 'Servono i saldi di tutti i conti alle due date.' : 'Si può confermare dal '+dataBreve(m.fine)+'.')+'</p>')+(c.scaduta && !c.completi ? '<div class="bottoni colonna"><button class="btn" data-act="chiudi_senza" data-id="'+id+'">Chiudi senza conteggio</button></div><p class="sotto centro">Per il primo mese, se manca la fotografia del 9 precedente: il mese si chiude senza spesa reale e senza scalare le voci.</p>' : '');
  o += fonteRiga('Spesa reale = liquidità del 9 precedente + entrate − importi investiti o versati al fondo − liquidità del 9. Giroconti esclusi. Regola: BUDGET §10.3.');
  const chiusi = lista('mesi').filter(x => x.stato === 'chiuso').sort((a,b) => a.id < b.id ? 1 : -1).slice(0,6);
  if (chiusi.length) o += '<section class="card"><h2>Mesi chiusi</h2>'+chiusi.map(x => riga(etichettaMese(meseDaId(x.id)), x.senza_conteggio ? 'chiuso senza conteggio' : 'spesa reale '+eur0(x.spesa_reale)+' · non registrate '+eur0(x.non_registrate))).join('')+'</section>';
  return o;
}

/* ===== Vista: Mensilità aggiuntive ===== */
function mensCorrente(){
  const M = ui.mens, t = oggi(); const data = isData(M.data) ? M.data : iso(t);
  let imp = num(M.importo); if (!isFinite(imp)) imp = P('budget.mensilita.'+M.tipo+'.importo') || 0;
  const prop = proponiMensilita(M.tipo, imp, data);
  if (M.mod) { for (const k in prop.buste) if (M.mod['b_'+k] != null) prop.buste[k] = num(M.mod['b_'+k]) || 0; for (const k of ['fe','fp','portafoglio','libera']) if (M.mod[k] != null) prop[k] = num(M.mod[k]) || 0; }
  const somma = r2(Object.values(prop.buste).reduce((s,v) => s+v, 0) + prop.fe + prop.fp + prop.portafoglio + prop.libera);
  return { prop, imp, data, somma, differenza: r2(imp - somma) };
}

  const M = ui.mens, x = mensCorrente(), p = x.prop, mod = M.modifica;

    '<label>Importo netto accreditato<input inputmode="decimal" data-mensf="importo" value="'+h(M.importo != null ? M.importo : fmtNum(x.imp, 0))+'"></label><label>Data di accredito<input type="date" data-mensf="data" value="'+x.data+'"></label></div></section>';
  const passo = (n, titolo, tot, corpo) => '<section class="card"><div class="passo"><b>'+n+'</b><span class="cresce">'+titolo+'</span><strong class="gr">'+eur0(tot)+'</strong></div>'+corpo+'</section>';

    o += passo(1, 'Voci annuali', totB, ordinati('buste').filter(b => b.tipo === 'annuale').map(b => riga(h(b.nome)+' <span class="sotto">· già alimentata '+eur0(alimentatoAnno(b.id, x.data.slice(0,4)))+' di '+eur0(P(b.param))+'</span>', campo('b_'+b.id, p.buste[b.id] || 0))).join(''));
    const usato = (S.a.destinazioni.fondo_emergenza||{}).utilizzato || 0;
    o += passo(2, 'Fondo emergenza', p.fe, usato > 0 ? riga('Reintegro (usati '+eur0(usato)+')', campo('fe', p.fe)) : '<p class="sotto">È pieno: niente da reintegrare.</p>');
    let n = 3;
    if (M.tipo === 'una_tantum' || M.tipo === 'premio_extra') o += passo(n++, 'Fondo pensione, fino a '+eur0(P('budget.fondo_pensione.limite_deducibile')), p.fp, riga('Versamento volontario', campo('fp', p.fp)));
    o += passo(n, 'Risparmio extra', p.portafoglio + p.libera, riga('Al portafoglio di lungo periodo', campo('portafoglio', p.portafoglio)) + riga('Liquidità libera', campo('libera', p.libera)) + '<p class="sotto">Quello che avanza va metà al portafoglio e metà resta libero. La liquidità libera non è jolly.</p>');

    else if (c.ruolo === 'pensa') o += '<div class="bolla app">Leggo…</div>';
    else if (c.ruolo === 'nota') o += '<section class="card"><p class="sotto">'+h(c.testo)+'</p></section>';
    else if (c.ruolo === 'risposta') o += '<section class="card">'+(c.valore ? '<p class="numero">'+h(c.valore)+'</p>' : '')+'<p>'+h(c.testo)+'</p>'+(c.righe ? c.righe.map(r => riga(h(r[0]), h(r[1]))).join('') : '')+fonteRiga('Calcolato dall’app, non dall’assistente'+(c.fonte ? ' · '+h(c.fonte) : ''))+'</section>';
    else if (c.ruolo === 'attesa') { const x = S.a[c.arch][c.id]; viste.add(c.id); if (x && x.stato === 'non_confermato') o += cardAttesa(c.arch, Object.assign({id:c.id}, x)); else if (x) o += '<section class="card"><p class="sotto">Dato confermato e salvato.</p></section>'; else o += '<section class="card"><p class="sotto">Dato scartato.</p></section>'; }
  }
  for (const arch of ['movimenti','saldi','fondo_pensione']) for (const x of inAttesa(arch)) if (!viste.has(x.id)) o += cardAttesa(arch, x);
  o += '<div class="scrivi fondo"><label class="vh" for="q_chat">Messaggio</label><input id="q_chat" type="text" data-campo="chat" data-invio="chiedi" placeholder="Es. ho comprato una PS5 da 550 €" autocomplete="off"'+(S.sample ? '' : ' disabled')+'>'+
    (S.sample && S.limiti && S.limiti.images ? '<label class="quadro t-blu filebtn" aria-label="Allega una foto">'+ico('foto')+'<input type="file" accept="image/*" data-foto="chat" class="vh"></label>' : '')+
    (S.dett ? '<button class="quadro t-ambra-p" data-act="mic" data-campo="chat" aria-label="'+(ui.mic.attivo ? 'Ferma la dettatura' : 'Detta')+'">'+ico(ui.mic.attivo && ui.mic.campo === 'chat' ? 'stop' : 'mic')+'</button>' : '')+
    '<button class="quadro t-primario" data-act="chiedi" aria-label="Invia"'+(ui.occupato || !S.sample ? ' disabled' : '')+'>'+ico('invia')+'</button></div>';
  o += fonteRiga('L’assistente non calcola: estrae i dati e richiama le funzioni dell’app. Ogni dato letto resta “non confermato” finché non lo approvi.');
  return o;
}

/* ===== Vista: Dati e regole ===== */

  const docs = {}; for (const p of ps) (docs[p.documento] = docs[p.documento] || []).push(p);

    for (const p of docs[d].sort((a,b) => a.id < b.id ? -1 : 1)) o += '<button class="voce nudo" data-act="sheet" data-sheet="parametro" data-id="'+h(p.id)+'"><div class="cresce"><p class="nome">'+h(p.nome)+'</p><p class="sotto">'+(p.sezione ? '§'+h(p.sezione)+' · ' : '')+h(p.tipo)+(p.versione !== docs[d][0].versione ? ' · '+dataMedia(p.versione) : '')+(p.nota ? ' · '+h(p.nota) : '')+'</p></div><strong>'+h(fmtPar(p))+'</strong></button>';
  }

  o += '<section class="card"><h2>Ultimi movimenti</h2>'+(mv.length ? mv.map(x => rigaElim('movimenti', x, dataBreve(x.data)+' · '+({spesa:'spesa',alimentazione:'alimentazione',entrata:'entrata',non_registrate:'non registrate',fondo_pensione:'fondo pensione',rettifica:'rettifica'}[x.tipo]||x.tipo)+(x.busta && S.a.buste[x.busta] ? ' · '+S.a.buste[x.busta].nome : '')+(x.descrizione ? ' · '+x.descrizione : ''), eur(x.importo))).join('') : '<p class="sotto">Nessun movimento.</p>')+'</section>';
  const sd = lista('saldi').sort((a,b) => (b.data+(b.creato||'')) < (a.data+(a.creato||'')) ? -1 : 1).slice(0,30);
  o += '<section class="card"><h2>Ultimi saldi e letture</h2>'+(sd.length ? sd.map(x => rigaElim('saldi', x, dataBreve(x.data)+' · '+(x.oggetto === 'posizione' ? ((S.a.posizioni[x.etf]||{}).ticker||x.etf) : ((S.a.conti[x.conto]||{}).nome||x.conto))+' · '+(x.fonte||''), eur(x.oggetto === 'posizione' ? (x.valore != null ? x.valore : (x.quote||0)*(x.prezzo||0)) : x.importo))).join('') : '<p class="sotto">Nessun saldo.</p>')+'</section>';
  const op = lista('operazioni').sort((a,b) => b.data < a.data ? -1 : 1).slice(0,30);
  if (op.length) o += '<section class="card"><h2>Operazioni sul portafoglio</h2>'+op.map(x => rigaElim('operazioni', x, dataBreve(x.data)+' · '+({rata_ingresso:'rata di ingresso '+x.rata,versamento:'versamento mensile',risparmio_extra:'risparmio extra'}[x.tipo]||x.tipo), eur(x.importo))).join('')+fonteRiga('Eliminare un’operazione non modifica le posizioni: correggile a mano nel Portafoglio.')+'</section>';
  o += fonteRiga('I dati stanno nel file del tuo repository GitHub privato. Token e chiave API restano solo in questo browser. Stato del salvataggio e impostazioni: pulsante in alto a destra.');
  return o;
}
function fmtPar(p){ if (typeof p.valore === 'number') { const dec = Math.abs(p.valore - Math.round(p.valore)) > 1e-9 ? (String(p.valore).split('.')[1]||'').length : 0; if (p.unita === '€' || String(p.unita).startsWith('€/')) return eur(p.valore)+(p.unita.length > 1 ? p.unita.slice(1) : ''); if (p.unita === 'anno' || p.unita === 'giorno' || p.unita === 'mese') return String(p.valore); return fmtNum(p.valore, Math.min(dec,3))+(p.unita === '%' ? '%' : ' '+p.unita); } if (p.unita === 'data' && isData(p.valore)) return dataMedia(p.valore); return String(p.valore); }
function rigaElim(arch, x, testo, imp){ const k = arch+':'+x.id; return '<div class="voce"><div class="cresce"><p class="nome piccolo">'+h(testo)+(x.stato === 'non_confermato' ? ' '+chip('non confermato','ambra') : '')+'</p></div><strong>'+imp+'</strong><button class="link rosso" data-act="elimina" data-k="'+h(k)+'">'+(ui.elimina === k ? 'Confermi?' : 'Elimina')+'</button></div>'; }

/* ===== Fogli (moduli) ===== */
const opzBuste = sel => '<option value="">Nessuna voce (pesa sul mese)</option>'+ordinati('buste').map(b => '<option value="'+b.id+'"'+(sel === b.id ? ' selected' : '')+'>'+h(b.nome)+'</option>').join('');

  else if (s.tipo === 'saldo') { const x = s.pend ? S.a.saldi[s.pend] : {}; const sel = x.conto || s.id; t = 'Saldo di un conto';
    c = '<label>Conto<select id="f_conto">'+ordinati('conti').map(k => '<option value="'+k.id+'"'+(sel === k.id ? ' selected' : '')+'>'+h(k.nome)+'</option>').join('')+'</select></label><label>Saldo (per il conto comune, il saldo intero)<input id="f_imp" inputmode="decimal" value="'+h(x.importo != null ? fmtNum(x.importo, 2) : '')+'"></label><label>Data del saldo<input id="f_data" type="date" value="'+h(x.data||iso(oggi()))+'"></label>'; }
  else if (s.tipo === 'posizione') { const e = S.a.posizioni[s.id] || {}; const x = s.pend ? S.a.saldi[s.pend] : e; t = e.ticker+' · '+e.nome;
    c = '<p class="sotto">'+h(e.descrizione)+' · ISIN '+h(e.isin)+' · TER '+h(e.ter)+'</p><label>Quote<input id="f_quote" inputmode="decimal" value="'+h(x.quote != null ? String(x.quote).replace('.',',') : '')+'"></label><label>Prezzo per quota<input id="f_prezzo" inputmode="decimal" value="'+h(x.prezzo != null ? String(x.prezzo).replace('.',',') : '')+'"></label><label>Oppure valore totale<input id="f_valore" inputmode="decimal" value="'+h(x.quote == null && x.valore != null ? fmtNum(x.valore, 2) : '')+'"></label><label>Data<input id="f_data" type="date" value="'+h(x.data||iso(oggi()))+'"></label>'; }
  else if (s.tipo === 'fp') { const x = s.pend ? S.a.fondo_pensione[s.pend] : {}; const an = S.a.fondo_pensione.anagrafica || {}; t = 'Fondo pensione';
    c = '<p class="sotto">'+h(an.fondo||'')+' · comparto '+h(an.comparto||'')+'</p><label>Che cosa registri<select id="f_tipo"><option value="posizione"'+(x.tipo !== 'contributi' ? ' selected' : '')+'>Posizione individuale (valore lordo)</option><option value="contributi"'+(x.tipo === 'contributi' ? ' selected' : '')+'>Progressivo dei contributi deducibili dell’anno (voce 60450)</option></select></label><label>Importo<input id="f_imp" inputmode="decimal" value="'+h(x.posizione != null ? fmtNum(x.posizione,2) : (x.progressivo != null ? fmtNum(x.progressivo,2) : ''))+'"></label><label>Data<input id="f_data" type="date" value="'+h(x.data||iso(oggi()))+'"></label>'; }
  else if (s.tipo === 'fissa') { const x = S.a.spese_fisse[s.id]; t = x.nome;
    c = '<p class="sotto">'+h(x.frequenza)+' · '+(x.occorrenze_anno||12)+' volte l’anno · '+fonteDoc(x)+(x.nota ? ' · '+h(x.nota) : '')+'</p><label>Importo per volta (quota personale)<input id="f_imp" inputmode="decimal" value="'+h(fmtNum(x.importo, 2))+'"></label><label>Giorno del mese (vuoto = senza data, “fine” = ultimo giorno)<input id="f_giorno" value="'+h(x.giorno == null ? '' : x.giorno)+'"></label><label>Mesi in cui cade (numeri separati da virgola; vuoto = tutti)<input id="f_mesi" value="'+h(Array.isArray(x.mesi) ? x.mesi.join(', ') : '')+'"></label><p class="sotto">Importi e date sono dati reali: se cambia la stima annua, aggiorna anche il BUDGET.</p>'; }
  else if (s.tipo === 'apri_mese') { const m = meseDi(oggi()), st = stipendioAtteso(iso(m.inizio)); t = 'Apri il mese '+etichettaMese(m);
    c = '<label>Stipendio netto accreditato il '+dataBreve(accredito(m.inizio.getFullYear(), m.inizio.getMonth()))+'<input id="f_imp" inputmode="decimal" value="'+h(st ? fmtNum(st.importo, 0) : '')+'"></label><p class="sotto">Stima dal '+(st ? fonte(st.chiave) : 'BUDGET §1')+': sostituiscila con il netto reale. Mensilità aggiuntive e premio si registrano a parte.</p>'+
      ordinati('buste').filter(b => b.tipo === 'mensile').map(b => riga('Alimento “'+h(b.nome)+'”', eur(P(b.param)))).join('')+'<p class="sotto">Se parti a mese iniziato, la prima chiusura non è calcolabile: manca la fotografia del 9 precedente.</p>'; ok = 'Apri il mese'; }
  else if (s.tipo === 'fissa_importo') { const pr = proponiImportoDaInvestire(), d = destinazioni(); t = 'Importo da investire';
    c = '<p class="sotto">Liquidità − fondo emergenza − riserva casa − giacenza operativa − saldo delle voci di budget, alla fotografia del 9 che precede l’avvio (INVESTIMENTI §2).</p>'+d.righe.map(r => riga(h(r.nome), eur0(r.valore))).join('')+(pr == null ? '<p class="sotto warn">Mancano dei saldi: completa i conti prima di fissare l’importo.</p>' : '')+'<label>Importo fissato<input id="f_imp" inputmode="decimal" value="'+h(pr != null ? fmtNum(pr, 0) : '')+'"></label>'; ok = 'Fissa l’importo'; }
  else if (s.tipo === 'acquisto') { const pi = pianoIngresso(), vm = versamentoMensile(); let imp = 0, pesi = {};
    if (s.sub === 'rata_ingresso' && pi && pi.prossima) { imp = pi.rata; pesi = pi.pesi; t = 'Rata di ingresso '+pi.prossima.n+' di '+pi.n; }

    else { imp = extraDaInvestire(); pesi = pesiETF(target().attivo); t = 'Risparmio extra'; }
    const v = s.imp != null ? s.imp : imp, sp = ripartisci(isFinite(num(v)) ? num(v) : 0, pesi);
    c = '<label>Importo investito<input id="f_imp" inputmode="decimal" data-foglio="imp" value="'+h(typeof v === 'number' ? fmtNum(v, 0) : v)+'"></label><label>Data dell’acquisto<input id="f_data" type="date" value="'+iso(oggi())+'"></label>'+ordinati('posizioni').map(e => riga(h(e.ticker)+' <span class="sotto">'+(pesi[e.id]||0)+'%</span>', eur0(sp[e.id]||0))).join('')+'<p class="sotto">Ripartizione secondo i pesi target. Quote e prezzi reali si aggiornano poi con una foto delle posizioni.</p>'; ok = 'Registra'; }
  else if (s.tipo === 'ricalcolo') { const tg = target(); const ff = s.ff != null ? s.ff : String(P('policy.fed_funds.punto_medio')).replace('.',','); const az = azioniFormula(tg.ricalcolo, tg.inVigore.azioni, isFinite(num(ff)) ? num(ff) : null), bl = blocchi(az); t = 'Ricalcolo del '+dataMedia(tg.ricalcolo);
    c = '<p class="sotto">Azioni = '+P('policy.formula.base')+' − età ('+eta(tg.ricalcolo)+') − '+P('policy.formula.coefficiente')+' × Fed Funds, con variazione massima di ±'+P('policy.formula.variazione_max')+' punti l’anno (POLICY §6).</p><label>Fed Funds: punto medio della forchetta ufficiale alla data di ricalcolo (%)<input id="f_ff" inputmode="decimal" data-foglio="ff" value="'+h(ff)+'"></label><p class="sotto">L’app non accede al web: leggi la forchetta sul sito della Federal Reserve.</p>'+(bl ? barraTarget(bl)+riga('Nuovo target', bl.azioni+' / '+bl.obbligazioni+' / '+bl.managed_futures) : ''); ok = 'Conferma il ricalcolo'; }
  else if (s.tipo === 'parametro') { const p = S.a.parametri[s.id]; t = p.nome;

  else if (s.tipo === 'fe') { const d = S.a.destinazioni.fondo_emergenza || {}; t = 'Fondo emergenza';

/* ===== Funzioni richiamabili dall’assistente (calcola l’app) ===== */
const FUNZIONI = {

  buste: { d:'saldo di tutte le voci di budget', f(){ return { testo:'Saldo delle voci di budget a oggi.', righe: statoBuste().map(b => [b.nome, eur0(b.saldo)+' di '+eur0(b.importo)]), fonte:'BUDGET §10.2' }; } },
  busta: { d:'saldo di una voce di budget (argomento: id della voce)', f(a){ const b = statoBuste().find(x => x.id === a); if (!b) return FUNZIONI.buste.f(); return { valore:eur0(b.saldo), testo:'Resta in “'+b.nome+'”, su '+eur(b.importo)+(b.tipo === 'annuale' ? ' l’anno' : ' al mese')+'.', fonte:'BUDGET §10.2' }; } },
  destinazioni: { d:'liquidità divisa per destinazione (fondo emergenza, riserva casa, da investire…)', f(){ const d = destinazioni(); return { valore:eur0(d.totale), testo:'Liquidità per destinazione'+(d.completo ? '.' : ' (parziale: mancano dei saldi).'), righe: d.righe.map(r => [r.nome, eur0(r.valore)]), fonte:'INVESTIMENTI §1–2' }; } },
  giacenze: { d:'giacenze minime dei conti correnti', f(){ return { testo:'Giacenze minime, misurate il 9.', righe: giacenze().map(x => [x.c.nome, x.s ? eur0(x.s.importo)+' (minimo '+eur0(x.min)+')' : 'saldo mancante']), fonte:'BUDGET §10.1' }; } },
  target: { d:'target di azioni, obbligazioni e managed futures', f(){ const t = target(); if (!t) return { testo:'Target non disponibile.' }; const s = b => b.azioni+' / '+b.obbligazioni+' / '+b.managed_futures; return { valore:s(t.attivo), testo:'Azioni / obbligazioni / managed futures '+(t.attivoProbabile ? 'secondo la formula (ricalcolo da confermare).' : 'in vigore.')+(t.probabile && !t.attivoProbabile ? ' Probabile dal '+dataMedia(t.ricalcolo)+': '+s(t.probabile)+'.' : ''), fonte:'POLICY §6' }; } },
  fasce: { d:'ETF e blocchi fuori dalle fasce di ribilanciamento', f(){ const p = portafoglio(); if (!p.totale) return { testo:'Il portafoglio non ha ancora posizioni: nessun ETF può essere fuori fascia.', fonte:'POLICY §8' }; const fu = p.righe.filter(r => r.fuori); return { valore: fu.length ? String(fu.length) : 'Nessuno', testo: fu.length ? 'ETF fuori fascia: ricevono i versamenti del trimestre successivo.' : 'Tutti gli ETF sono dentro la fascia.', righe: fu.map(r => [r.e.ticker, perc(r.attuale)+' su '+r.target+'%']), fonte:'POLICY §8' }; } },
  prossima_rata: { d:'prossima rata di ingresso nel portafoglio', f(){ const pi = pianoIngresso(); if (!pi || !pi.prossima) return { testo:'Non ci sono rate di ingresso da fare.', fonte:'INVESTIMENTI §2' }; return { valore:eur0(pi.rata), testo:'Rata '+pi.prossima.n+' di '+pi.n+', '+dataLunga(pi.prossima.data)+' '+pi.prossima.data.getFullYear()+'.'+(pi.fissato ? '' : ' Importo stimato, da rimisurare prima dell’avvio.'), fonte:'INVESTIMENTI §2' }; } },

function prompt(testo, conFoto){

  '\n\nCONTI (id: nome):\n'+ordinati('conti').map(c => c.id+': '+c.nome).join('\n')+'\n\nETF DEL PORTAFOGLIO (id: sigla – nome – ISIN):\n'+ordinati('posizioni').map(e => e.id+': '+e.ticker+' – '+e.nome+' – '+e.isin).join('\n')+
  '\n\nFUNZIONI (nome: che cosa calcola l’app):\n'+Object.entries(FUNZIONI).map(([k,v]) => k+': '+v.d).join('\n')+
  '\n\nFormato: {"azioni":[...],"nota":""}\nTipi di azione ammessi:\n{"tipo":"spesa","importo":numero,"busta":"id" oppure null,"descrizione":"breve","data":"AAAA-MM-GG"}\n{"tipo":"entrata","importo":numero,"descrizione":"breve","data":"AAAA-MM-GG"}\n{"tipo":"saldo","conto":"id","importo":numero,"data":"AAAA-MM-GG"}\n{"tipo":"posizione","etf":"id","quote":numero oppure null,"prezzo":numero oppure null,"valore":numero oppure null,"data":"AAAA-MM-GG"}\n{"tipo":"fondo_pensione","posizione":numero,"data":"AAAA-MM-GG"}\n{"tipo":"domanda","funzione":"nome","argomento":"testo o id, anche vuoto"}\n\nRegole:\n- Copia i numeri come li leggi, senza somme, conversioni, stime o arrotondamenti. Usa il punto come separatore decimale.\n- Se un dato non è leggibile o non è certo, non inventarlo: lascialo fuori e dillo in "nota".\n- Se la data non è indicata usa quella di oggi; per uno screenshot usa la data che compare nell’immagine, se c’è.\n- Per una spesa scegli la busta dal contenuto; se non rientra in nessuna, "busta": null.\n- Mutuo, nido, bollette, spesa alimentare e le altre spese fisse non si registrano come spese: mettilo in "nota".\n- Per il conto comune riporta il saldo intero del conto, non la metà.\n- Per una domanda scegli una sola funzione dell’elenco; se nessuna risponde, azioni vuoto e una frase in "nota".\n- "nota" è una frase breve in italiano, senza numeri calcolati da te.\n\nMessaggio dell’utente: «'+String(testo||'').slice(0,2000)+'»';

  for (const r of righe) { const d = String(r[4]||'').toLowerCase(); for (const x of conti) if (d.includes(String(x.testo).toLowerCase())) punti[x.conto] = (punti[x.conto]||0)+1; }
  const best = Object.entries(punti).sort((a,b) => b[1]-a[1])[0]; return best ? best[0] : '';
}
function righeBpm(tab){
  const ih = tab.findIndex(r => r && String(r[0]).trim() === 'Data Contabile' && String(r[4]||'').indexOf('Causale') === 0); if (ih < 0) return null;
  const corpo = tab.slice(ih+1).filter(r => r && r[0]); const conto = contoBpm(corpo), visti = {};
  const out = corpo.filter(r => !r[5] || /^cont/i.test(String(r[5]).trim())).map(r => {
    const data = dataIt(r[0]), importo = numIt(r[2]), raw = String(r[4]||''), desc = pulisciBpm(raw);
    const base = 'b-'+data+'-'+Math.round(importo*100)+'-'+hashTesto(raw.toLowerCase()); visti[base] = (visti[base]||0)+1;
    return { id: base+'-'+visti[base], fonte:'bpm', data, data_op:dataIt(r[1]), importo, descrizione:desc.slice(0,90), testo:raw+' '+desc, gruppo:gruppoDi(desc), mcc:null };
  }).filter(x => x.data && isFinite(x.importo));

}
function righeTr(tab){

    let desc = nome; if (tipo === 'BUY') desc = 'Acquisto ETF '+String(v(r,'symbol')); else if (/TRANSFER/.test(tipo)) desc = 'Bonifico da '+String(v(r,'counterparty_name')||'').slice(0,40); else if (tipo === 'INTEREST_PAYMENT') desc = 'Interessi netti'; else if (tipo === 'BENEFITS_SAVEBACK') desc = 'Saveback';

    return { id:'tr-'+String(v(r,'transaction_id')), fonte:'tr', data:String(v(r,'date')).slice(0,10), data_op:String(v(r,'date')).slice(0,10), importo:r2(imp), descrizione:desc.slice(0,90), testo:desc+' '+String(v(r,'description'))+' '+cp, gruppo:gruppoDi(desc), mcc: v(r,'mcc_code') ? Number(v(r,'mcc_code')) : null, pre };

function cardChiusuraEstratti(c){

  if (!c.copertura.completo) return '<section class="card nota-ambra"><p class="titolino">Estratti conto da importare</p><p class="sotto">'+c.copertura.manca.map(h).join(' · ')+'</p><p class="sotto">Con gli estratti fino al '+dataBreve(c.d1)+' le spese non registrate si ripartiscono sulle voci di budget; senza, vanno tutte in “'+h(c.busta ? c.busta.nome : 'Uscite quotidiane')+'” (BUDGET §10.3).</p><button class="btn" data-go="estratto">Importa gli estratti conto</button></section>';
  const ids = Object.keys(Object.assign({}, c.importato, c.segnalatePerVoce)).filter(b => S.a.buste[b]);
  return '<section class="card"><h2>Ripartizione dagli estratti conto</h2><div class="tab-estr tab4"><span></span><span>Importato</span><span>Segnalato</span><span>Si scala</span>'+
    ids.map(b => '<span>'+h(S.a.buste[b].nome)+'</span><b>'+eur0(c.importato[b]||0)+'</b><span>'+eur0(c.segnalatePerVoce[b]||0)+'</span><b>'+eur0(c.ripartizione[b]||0)+'</b>').join('')+'</div>'+
    riga('Totale dagli estratti', eur0(c.daEstratto))+riga(c.residuo >= 0 ? 'Resto non spiegato → “'+h(c.busta ? c.busta.nome : '')+'”' : 'Differenza non attribuita', eur0(Math.abs(c.residuo)), c.residuo > 0 ? 'rosso' : '')+
    fonteRiga('Per ogni voce si scala la parte importata che supera le spese segnalate a mano. Il resto delle spese non registrate va alla voce predefinita; se è negativo non si attribuisce. Le spese fisse restano quelle preventivate (BUDGET §10.3).')+'</section>';
}
const _vChius3e = VISTE.chiusura;
VISTE.chiusura = function(){ const o = _vChius3e(), daCh = meseDaChiudere(), id = daCh || meseDi(oggi()).id; if (!S.a.mesi[id]) return o;
  const c = chiusuraCon(id), k = o.indexOf('<section class="card"><h2>Dove sono andati</h2>'); if (k < 0) return o; const fine = o.indexOf('</section>', k) + 10;
  return o.slice(0, fine) + cardChiusuraEstratti(c) + o.slice(fine); };
const _daFare3e = daFare;
daFare = function(){
  const l = _daFare3e(), mc = meseDaChiudere(); if (!mc) return l;
  const cm = coperturaMese(meseDaId(mc)); if (cm.completo || S.a.mesi[mc] && S.a.mesi[mc].senza_conteggio) return l;
  const k = l.findIndex(x => /^Fotografia/.test(x.titolo)); const it = { titolo:'Importa gli estratti conto fino al '+dataBreve(meseDaId(mc).fine), testo:'Prima della chiusura: così le spese non registrate si ripartiscono sulle voci.', fonte:'BUDGET §10.3', btn:['Importa','go','estratto'] };
  l.splice(k < 0 ? l.length : k, 0, it); return l;
};
